name: Deploy to Azure Container Apps

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY_NAME: remakeacr1001
  RESOURCE_GROUP: my-resource-group
  LOCATION: koreacentral
  ENVIRONMENT_NAME: myenv
  APP_NAME_WEB: web-app
  APP_NAME_API: api-app

jobs:
  setup-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Create ACR if it doesn't exist
      - name: Create Container Registry
        run: |
          az acr create \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name ${{ env.REGISTRY_NAME }} \
            --sku Basic \
            --admin-enabled true || echo "Registry already exists"

      # Build and push web image (nginx)
      - name: Build and Push Web Image
        run: |
          az acr build \
            --registry ${{ env.REGISTRY_NAME }} \
            --image web:${{ github.sha }} \
            --image web:latest \
            --file Dockerfile.web .
        continue-on-error: true

      # Build and push API image
      - name: Build and Push API Image
        run: |
          az acr build \
            --registry ${{ env.REGISTRY_NAME }} \
            --image api:${{ github.sha }} \
            --image api:latest \
            --file Dockerfile.api .
        continue-on-error: true

      # Create Container Apps Environment if it doesn't exist
      - name: Create Container Apps Environment
        run: |
          az containerapp env create \
            --name ${{ env.ENVIRONMENT_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --location ${{ env.LOCATION }} || echo "Environment already exists"

      # Deploy Web Container App
      - name: Deploy Web Container App
        run: |
          REGISTRY_URL="${{ env.REGISTRY_NAME }}.azurecr.io"
          REGISTRY_USERNAME=$(az acr credential show --name ${{ env.REGISTRY_NAME }} --query username -o tsv)
          REGISTRY_PASSWORD=$(az acr credential show --name ${{ env.REGISTRY_NAME }} --query passwords[0].value -o tsv)

          az containerapp create \
            --name ${{ env.APP_NAME_WEB }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --environment ${{ env.ENVIRONMENT_NAME }} \
            --image $REGISTRY_URL/web:latest \
            --target-port 80 \
            --ingress external \
            --registry-server $REGISTRY_URL \
            --registry-username $REGISTRY_USERNAME \
            --registry-password $REGISTRY_PASSWORD \
            --cpu 0.5 \
            --memory 1.0Gi \
            --env-vars NGINX_HOST=example.com || \
          az containerapp update \
            --name ${{ env.APP_NAME_WEB }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image $REGISTRY_URL/web:latest

      # Deploy API Container App
      - name: Deploy API Container App
        run: |
          REGISTRY_URL="${{ env.REGISTRY_NAME }}.azurecr.io"
          REGISTRY_USERNAME=$(az acr credential show --name ${{ env.REGISTRY_NAME }} --query username -o tsv)
          REGISTRY_PASSWORD=$(az acr credential show --name ${{ env.REGISTRY_NAME }} --query passwords[0].value -o tsv)

          az containerapp create \
            --name ${{ env.APP_NAME_API }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --environment ${{ env.ENVIRONMENT_NAME }} \
            --image $REGISTRY_URL/api:latest \
            --target-port 3000 \
            --ingress internal \
            --registry-server $REGISTRY_URL \
            --registry-username $REGISTRY_USERNAME \
            --registry-password $REGISTRY_PASSWORD \
            --cpu 1.0 \
            --memory 2.0Gi \
            --env-vars API_ENV=production LOG_LEVEL=info || \
          az containerapp update \
            --name ${{ env.APP_NAME_API }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image $REGISTRY_URL/api:latest

      # Output deployment URLs
      - name: Get Deployment URLs
        run: |
          echo "## Deployment Complete ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Web App" >> $GITHUB_STEP_SUMMARY
          az containerapp show --name ${{ env.APP_NAME_WEB }} --resource-group ${{ env.RESOURCE_GROUP }} --query properties.configuration.ingress.fqdn -o tsv >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Container Registry" >> $GITHUB_STEP_SUMMARY
          echo "${{ env.REGISTRY_NAME }}.azurecr.io" >> $GITHUB_STEP_SUMMARY
