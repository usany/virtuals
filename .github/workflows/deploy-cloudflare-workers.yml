name: Deploy Cloudflare Workers with D1 and R2

on:
  push:
    branches: [main]
    paths:
      - 'cloudflare-worker/**'
      - '.github/workflows/deploy-cloudflare-workers.yml'
  pull_request:
    branches: [main]
    paths:
      - 'cloudflare-worker/**'
  workflow_dispatch:

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  setup-d1-r2:
    name: Setup D1 Database and R2 Bucket
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Wrangler CLI
        run: npm install -g wrangler

      - name: Authenticate with Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo "Authenticating with Cloudflare..."

      - name: Create D1 Database
        id: create-d1
        run: |
          cd cloudflare-worker

          echo "Checking if D1 database exists..."
          DB_LIST=$(wrangler d1 list --json 2>/dev/null || echo "[]")
          DB_ID=$(echo "$DB_LIST" | jq -r '.[] | select(.name=="production-db") | .id' 2>/dev/null || echo "")

          if [ -z "$DB_ID" ] || [ "$DB_ID" = "null" ]; then
            echo "Creating D1 database: production-db"
            wrangler d1 create production-db --yes
            sleep 2
            DB_LIST=$(wrangler d1 list --json 2>/dev/null || echo "[]")
            DB_ID=$(echo "$DB_LIST" | jq -r '.[] | select(.name=="production-db") | .id' 2>/dev/null || echo "")
          fi

          echo "D1 Database ID: $DB_ID"
          echo "database_id=$DB_ID" >> $GITHUB_OUTPUT

      - name: Apply D1 Migrations
        run: |
          cd cloudflare-worker

          if [ -f "migrations/001_init.sql" ]; then
            echo "Applying D1 schema migrations..."
            wrangler d1 execute production-db --file=migrations/001_init.sql --remote
          fi

      - name: Create R2 Bucket
        id: create-r2
        run: |
          cd cloudflare-worker

          echo "Checking if R2 bucket exists..."
          BUCKET_LIST=$(wrangler r2 bucket list --json 2>/dev/null || echo "[]")
          BUCKET_EXISTS=$(echo "$BUCKET_LIST" | jq '.[] | select(.name=="my-uploads") | .name' 2>/dev/null || echo "")

          if [ -z "$BUCKET_EXISTS" ]; then
            echo "Creating R2 bucket: my-uploads"
            wrangler r2 bucket create my-uploads
          else
            echo "R2 bucket already exists"
          fi

          echo "bucket_name=my-uploads" >> $GITHUB_OUTPUT

      - name: Verify Infrastructure Setup
        run: |
          cd cloudflare-worker

          echo "=== D1 Databases ==="
          wrangler d1 list --json | jq '.[] | {name, id}' || echo "No databases found"

          echo ""
          echo "=== R2 Buckets ==="
          wrangler r2 bucket list --json | jq '.[] | {name}' || echo "No buckets found"

  deploy-worker:
    name: Deploy Cloudflare Worker
    runs-on: ubuntu-latest
    needs: setup-d1-r2
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Dependencies
        run: |
          cd cloudflare-worker
          npm install

      - name: Get D1 Database ID
        id: get-db-id
        run: |
          cd cloudflare-worker
          npm install -g wrangler

          DB_LIST=$(wrangler d1 list --json 2>/dev/null || echo "[]")
          DB_ID=$(echo "$DB_LIST" | jq -r '.[] | select(.name=="production-db") | .id' 2>/dev/null || echo "")

          echo "database_id=$DB_ID" >> $GITHUB_OUTPUT
          echo "Using D1 Database ID: $DB_ID"

      - name: Update wrangler.toml with D1 ID
        run: |
          cd cloudflare-worker

          DB_ID="${{ steps.get-db-id.outputs.database_id }}"

          if [ ! -z "$DB_ID" ] && [ "$DB_ID" != "null" ]; then
            sed -i "s/database_id = \"\"/database_id = \"$DB_ID\"/g" wrangler.toml
            echo "Updated wrangler.toml with D1 database_id: $DB_ID"
          fi

          cat wrangler.toml | grep -A 5 "d1_databases"

      - name: Deploy Worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          cd cloudflare-worker
          wrangler deploy

  test-endpoints:
    name: Test Worker Endpoints
    runs-on: ubuntu-latest
    needs: deploy-worker
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Get Worker URL
        id: get-url
        run: |
          WORKER_NAME=$(grep "^name = " cloudflare-worker/wrangler.toml | sed 's/.*= "//' | sed 's/".*//')
          ACCOUNT_ID="${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
          WORKER_URL="https://${WORKER_NAME}.${ACCOUNT_ID}.workers.dev"

          echo "worker_url=$WORKER_URL" >> $GITHUB_OUTPUT
          echo "Worker URL: $WORKER_URL"

      - name: Wait for Worker Deployment
        run: sleep 5

      - name: Test Health Endpoint
        run: |
          WORKER_URL="${{ steps.get-url.outputs.worker_url }}"
          echo "Testing: $WORKER_URL"

          curl -s "$WORKER_URL" | jq . || echo "Health check response"

      - name: Test D1 Endpoint
        run: |
          WORKER_URL="${{ steps.get-url.outputs.worker_url }}"

          echo "Testing: $WORKER_URL/api/items"
          curl -s "$WORKER_URL/api/items" | jq . || echo "D1 endpoint response"

      - name: Test R2 Endpoint
        run: |
          WORKER_URL="${{ steps.get-url.outputs.worker_url }}"

          echo "Testing: $WORKER_URL/api/files"
          curl -s "$WORKER_URL/api/files" | jq . || echo "R2 endpoint response"

  summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [setup-d1-r2, deploy-worker]
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Create Deployment Summary
        run: |
          ACCOUNT_ID="${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
          WORKER_NAME=$(grep "^name = " cloudflare-worker/wrangler.toml | sed 's/.*= "//' | sed 's/".*//')

          echo "## ✅ Cloudflare Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Resources Created" >> $GITHUB_STEP_SUMMARY
          echo "- **Worker**: \`$WORKER_NAME\`" >> $GITHUB_STEP_SUMMARY
          echo "- **D1 Database**: \`production-db\`" >> $GITHUB_STEP_SUMMARY
          echo "- **R2 Bucket**: \`my-uploads\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Deployment Info" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Author**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### API Endpoints" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "GET  https://$WORKER_NAME.$ACCOUNT_ID.workers.dev/" >> $GITHUB_STEP_SUMMARY
          echo "POST https://$WORKER_NAME.$ACCOUNT_ID.workers.dev/api/items" >> $GITHUB_STEP_SUMMARY
          echo "GET  https://$WORKER_NAME.$ACCOUNT_ID.workers.dev/api/items" >> $GITHUB_STEP_SUMMARY
          echo "POST https://$WORKER_NAME.$ACCOUNT_ID.workers.dev/api/upload" >> $GITHUB_STEP_SUMMARY
          echo "GET  https://$WORKER_NAME.$ACCOUNT_ID.workers.dev/api/files" >> $GITHUB_STEP_SUMMARY
          echo "GET  https://$WORKER_NAME.$ACCOUNT_ID.workers.dev/api/stats" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
